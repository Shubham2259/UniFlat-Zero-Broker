spring:
  datasource:
    url: jdbc:mysql://${TIDB_HOST:${DB_HOST:localhost}}:${TIDB_PORT:${DB_PORT:4000}}/${TIDB_NAME:${DB_NAME:uniflat}}?useSSL=true&requireSSL=true&serverTimezone=UTC
    username: ${TIDB_USER:${DB_USERNAME:root}}
    password: ${TIDB_PASSWORD:${DB_PASSWORD}}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      data-source-properties:
        trustCertificateKeyStorePassword: ${TIDB_TRUSTSTORE_PASSWORD:}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

app:
  jwt:
    secret: ${JWT_SECRET}