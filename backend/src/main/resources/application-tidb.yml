
spring:
  datasource:
    url: "jdbc:mysql://${TIDB_HOST}:${TIDB_PORT:4000}/${TIDB_NAME:uniflat}?sslMode=VERIFY_IDENTITY&trustCertificateKeyStoreUrl=file:/D:/Java%20project/UniFlat/tidb-truststore.p12&trustCertificateKeyStoreType=PKCS12"
    username: ${TIDB_USER}
    password: ${TIDB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      data-source-properties:
        trustCertificateKeyStorePassword: ${TIDB_TRUSTSTORE_PASSWORD:}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

app:
  jwt:
    secret: ${JWT_SECRET}