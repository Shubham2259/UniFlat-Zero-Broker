server:
  port: 8080
  error:
    include-message: always
    include-binding-errors: always

spring:
  application:
    name: uniflat-backend

  datasource:
    url: jdbc:mysql://${TIDB_HOST:${DB_HOST:localhost}}:${TIDB_PORT:${DB_PORT:4000}}/${TIDB_NAME:${DB_NAME:uniflat}}?useSSL=true&requireSSL=true&serverTimezone=UTC
    username: ${TIDB_USER:${DB_USERNAME:root}}
    password: ${TIDB_PASSWORD:${DB_PASSWORD}}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
    open-in-view: false

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:uniflat.platform@gmail.com}
    password: ${MAIL_PASSWORD:dummy_password}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  sql:
    init:
      mode: never

app:
  jwt:
    secret: ${JWT_SECRET}
    expiration-milliseconds: 86400000

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}